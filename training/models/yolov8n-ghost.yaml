# YOLOv8n + GhostNet 轻量骨干（改进③）
#
# 将骨干中的标准卷积替换为 GhostConv、C2f 替换为 C3Ghost，
# 用廉价线性变换生成冗余特征图，降低参数量与计算量（轻量化）。
#
# GhostConv / C3Ghost 均为 ultralytics 内置模块，会正常参与 width 缩放，
# 因此保留 scales 机制，与官方 yolov8n 对齐。
#
# 用法：python training/scripts/train.py --config training/configs/ablation_ghost.yaml \
#           --model training/models/yolov8n-ghost.yaml --pretrained training/weights/yolov8n.pt

nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, GhostConv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, GhostConv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C3Ghost, [128]]              # 2
  - [-1, 1, GhostConv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C3Ghost, [256]]              # 4  (P3)
  - [-1, 1, GhostConv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C3Ghost, [512]]              # 6  (P4)
  - [-1, 1, GhostConv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C3Ghost, [1024]]             # 8  (P5)
  - [-1, 1, SPPF, [1024, 5]]             # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 cat P4
  - [-1, 3, C2f, [512]]                          # 12 (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14 cat P3
  - [-1, 3, C2f, [256]]                          # 15 (P3)

  - [-1, 1, Conv, [256, 3, 2]]                   # 16
  - [[-1, 12], 1, Concat, [1]]                   # 17 cat P4
  - [-1, 3, C2f, [512]]                          # 18 (P4)

  - [-1, 1, Conv, [512, 3, 2]]                   # 19
  - [[-1, 9], 1, Concat, [1]]                    # 20 cat P5
  - [-1, 3, C2f, [1024]]                         # 21 (P5)

  - [[15, 18, 21], 1, Detect, [nc]]              # Detect(P3, P4, P5)
