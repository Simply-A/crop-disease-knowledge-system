# Ultralytics YOLOv8 + P2 小目标检测层（改进②）
#
# 在原 YOLOv8 的 P3/P4/P5 三个检测尺度之上，新增来自骨干浅层的
# P2（1/4 分辨率）高分辨率检测层，直接针对「早期病斑小目标漏检」问题。
#
# 用法：python training/scripts/train.py --config training/configs/ablation_p2.yaml \
#           --model training/models/yolov8n-p2.yaml
#
# 说明：沿用 yolov8.yaml 的 scales 缩放机制，用 n 规格时与 yolov8n 完全对齐，
#       仅在 head 增加 P2 支路与一个检测尺度，保证消融实验的可比性。

nc: 80 # number of classes
scales: # model compound scaling constants
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8.0 backbone（与官方一致）
backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2  (P2/4 特征，供 P2 头使用)
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4  (P3/8)
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6  (P4/16)
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]      # 8  (P5/32)
  - [-1, 1, SPPF, [1024, 5]]        # 9

# head：在官方 P3/P4/P5 基础上，向上采样引出 P2 支路
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 cat backbone P4
  - [-1, 3, C2f, [512]]                          # 12 (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14 cat backbone P3
  - [-1, 3, C2f, [256]]                          # 15 (P3)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16 新增上采样
  - [[-1, 2], 1, Concat, [1]]                    # 17 cat backbone P2
  - [-1, 3, C2f, [128]]                          # 18 (P2/4-small)

  - [-1, 1, Conv, [128, 3, 2]]                   # 19 新增下采样
  - [[-1, 15], 1, Concat, [1]]                   # 20 cat head P3
  - [-1, 3, C2f, [256]]                          # 21 (P3)

  - [-1, 1, Conv, [256, 3, 2]]                   # 22
  - [[-1, 12], 1, Concat, [1]]                   # 23 cat head P4
  - [-1, 3, C2f, [512]]                          # 24 (P4)

  - [-1, 1, Conv, [512, 3, 2]]                   # 25
  - [[-1, 9], 1, Concat, [1]]                    # 26 cat backbone P5
  - [-1, 3, C2f, [1024]]                         # 27 (P5)

  - [[18, 21, 24, 27], 1, Detect, [nc]]          # Detect(P2, P3, P4, P5)
