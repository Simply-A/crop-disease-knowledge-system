# YOLOv8n + 三项改进叠加：GhostNet 骨干 + P2 小目标层 + CBAM 注意力
#
# 消融实验的组合组（A4）。因 CBAM 为自定义模块（不参与 width 缩放），
# 本 yaml 直接写死 n 规格（width=0.25, depth=0.33）的实际通道数。
#
# 用法：python training/scripts/train.py --config training/configs/ablation_full.yaml \
#           --pretrained training/weights/yolov8n.pt

nc: 80

# 骨干：GhostConv + C3Ghost 轻量化（写死 n 规格通道）
backbone:
  - [-1, 1, GhostConv, [16, 3, 2]]      # 0-P1/2
  - [-1, 1, GhostConv, [32, 3, 2]]      # 1-P2/4
  - [-1, 1, C3Ghost, [32]]              # 2  (P2)
  - [-1, 1, GhostConv, [64, 3, 2]]      # 3-P3/8
  - [-1, 2, C3Ghost, [64]]              # 4  (P3)
  - [-1, 1, GhostConv, [128, 3, 2]]     # 5-P4/16
  - [-1, 2, C3Ghost, [128]]             # 6  (P4)
  - [-1, 1, GhostConv, [256, 3, 2]]     # 7-P5/32
  - [-1, 1, C3Ghost, [256]]             # 8  (P5)
  - [-1, 1, SPPF, [256, 5]]             # 9

# 颈部：P2 小目标层 + 各尺度 CBAM 注意力
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 cat P4
  - [-1, 1, C2f, [128, False]]                   # 12 (P4)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14 cat P3
  - [-1, 1, C2f, [64, False]]                    # 15 (P3)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 2], 1, Concat, [1]]                    # 17 cat P2
  - [-1, 1, C2f, [32, False]]                    # 18 (P2)
  - [-1, 1, CBAM, [32]]                          # 19 CBAM@P2

  - [-1, 1, Conv, [32, 3, 2]]                    # 20
  - [[-1, 15], 1, Concat, [1]]                   # 21 cat P3
  - [-1, 1, C2f, [64, False]]                    # 22 (P3)
  - [-1, 1, CBAM, [64]]                          # 23 CBAM@P3

  - [-1, 1, Conv, [64, 3, 2]]                    # 24
  - [[-1, 12], 1, Concat, [1]]                   # 25 cat P4
  - [-1, 1, C2f, [128, False]]                   # 26 (P4)
  - [-1, 1, CBAM, [128]]                         # 27 CBAM@P4

  - [-1, 1, Conv, [128, 3, 2]]                   # 28
  - [[-1, 9], 1, Concat, [1]]                    # 29 cat P5
  - [-1, 1, C2f, [256, False]]                   # 30 (P5)
  - [-1, 1, CBAM, [256]]                         # 31 CBAM@P5

  - [[19, 23, 27, 31], 1, Detect, [nc]]          # Detect(P2, P3, P4, P5)
